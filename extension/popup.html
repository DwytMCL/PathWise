<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PathWise Exporter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 280px;
      background: #f8fafc;
      color: #1e293b;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:active {
      background: #1e40af;
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    #status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    #status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .stats {
      margin-top: 10px;
      font-size: 11px;
      color: #334155;
    }
    .stats div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>
  <h2>PathWise Exporter</h2>
  <p>Export your MMCL curriculum directly from the portal to JSON.</p>
  
  <button id="exportBtn" class="btn">
    <span>Export Curriculum JSON</span>
  </button>

  <div id="status"></div>
  <div id="stats" class="stats"></div>

  <script src="popup.js"></script>
</body>
</html>
